services:
  postgres:
    image: postgres:16-alpine
    container_name: carepal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carepal
      POSTGRES_PASSWORD: carepal_secret
      POSTGRES_DB: carepal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepal -d carepal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: carepal-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      MP_MAX_MESSAGES: 500

  user-app:
    container_name: carepal-user-app
    build:
      context: .
      dockerfile: apps/user/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "24678:24678"
    env_file:
      - apps/user/.env
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://carepal:carepal_secret@postgres:5432/carepal_db?schema=public
      STORAGE_DIR: /app/storage/uploads
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_SECURE: "false"
      EMAIL_FROM: "TheCarePal Careers <careers@thecarepal.test>"
    volumes:
      - ./apps/user:/app/apps/user
      - /app/apps/user/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  admin-app:
    container_name: carepal-admin-app
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "24679:24679"
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_URL: postgresql://carepal:carepal_secret@postgres:5432/carepal_db?schema=public
      STORAGE_DIR: /app/storage/uploads
      USER_APP_URL: http://localhost:3000
      SESSION_SECRET: carepal_session_secret_local_dev_key_32chars
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_SECURE: "false"
      EMAIL_FROM: "TheCarePal Admin <admin@thecarepal.test>"
      ADMIN_SEED_EMAIL: admin@thecarepal.test
      ADMIN_SEED_PASSWORD: CarePalAdmin2026!
    volumes:
      - ./apps/admin:/app/apps/admin
      - /app/apps/admin/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
      - /app/packages/ui/node_modules
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
